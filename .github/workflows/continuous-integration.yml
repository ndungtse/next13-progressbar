name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  Linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
      - name: Add problem matcher
        run: echo "::add-matcher::.github/problemMatchers/eslint.json"
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ESLint
        run: pnpm exec eslint src/ e2e/ playwright.config.ts
      - name: Check formatting
        run: pnpm exec prettier --check "src/**/*.{ts,tsx}" "e2e/**/*.{ts,tsx}"

  Building:
    name: Compile source code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
      - name: Add problem matcher
        run: echo "::add-matcher::.github/problemMatchers/tsc.json"
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck And Build Code
        run: pnpm typecheck && pnpm build

  E2E:
    name: E2E (Next.js ${{ matrix.next }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - next: '14'
            install: next@14.2.35 react@18.3.1 react-dom@18.3.1 @types/react@18.3.31 @types/react-dom@18.3.7 typescript@5.9.3
          - next: '15'
            install: next@15.5.29
          - next: '16'
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # Build with the repo's toolchain before swapping in the Next.js version under test
      - name: Build Package
        run: pnpm build
      - name: Install Next.js ${{ matrix.next }}
        if: matrix.install
        run: pnpm add --save-dev ${{ matrix.install }}
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Test against next build
        run: pnpm exec playwright test
      - name: Test against next dev (Strict Mode)
        run: pnpm exec playwright test
        env:
          E2E_DEV: '1'
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-next-${{ matrix.next }}
          path: playwright-report/
